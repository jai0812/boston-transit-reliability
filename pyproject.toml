[project]
name = "boston-transit-reliability"
version = "0.1.0"
description = "Historical replay of Blue Line arrivals with calibrated LightGBM quantile forecasts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=17",
  "pandas>=2.2",
  "numpy>=1.26",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
  "pyyaml>=6",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Query() defaults are idiomatic
